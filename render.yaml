# Render blueprint.
#
#   web    serves the dashboard and refreshes forecasts in a background thread
#   cron   regenerates the walk-forward backtest nightly onto a shared disk
#
# A single gunicorn worker is deliberate. The fitted models live in process
# memory, so a second worker would train its own copy of all eleven and roughly
# double both memory and startup CPU for nothing. Threads handle concurrency.
#
# Plan sizing: a full refresh fits eleven models and takes about a minute on two
# cores. Standard (1 CPU / 2 GB) keeps that near a minute and leaves headroom for
# the tree ensembles. Starter (0.5 CPU / 512 MB) will run but refreshes take
# several minutes and memory is tight; Free additionally spins the instance down
# after 15 minutes idle, which discards every fitted model and makes the next
# visitor sit through a cold rebuild.

services:
  - type: web
    name: btc-model-dashboard
    runtime: python
    plan: standard
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --workers 1 --threads 4 --timeout 180
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: btc-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: BTC_CACHE_DIR
        value: /var/data
      - key: BTC_REFRESH_SECONDS
        value: "900"          # rebuild forecasts every 15 minutes
      - key: BTC_N_PATHS
        value: "30000"        # Monte Carlo paths per model per horizon
      - key: BTC_N_JOBS
        value: "2"
      - key: BTC_LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      # Set to "1" to generate a backtest on first boot when the disk is empty,
      # instead of waiting for the nightly job below. It competes with request
      # serving for CPU, so leave it off unless the instance has headroom.
      - key: BTC_BACKTEST_ON_START
        value: "0"

  - type: cron
    name: btc-backtest-nightly
    runtime: python
    plan: standard
    region: oregon
    schedule: "20 4 * * *"    # 04:20 UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_backtest.py --quiet
    disk:
      name: btc-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: BTC_CACHE_DIR
        value: /var/data
      - key: BTC_BACKTEST_DAYS
        value: "1095"
      - key: BTC_REFIT_EVERY
        value: "45"
      - key: BTC_N_JOBS
        value: "2"
